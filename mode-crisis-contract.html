    <style>
        :root { --bg:#000; --fg:#fff; --muted:#888; --line:#222; }
        * { margin:0; padding:0; box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#333 #000; }
        *::-webkit-scrollbar { width:4px; }
        *::-webkit-scrollbar-track { background:#000; }
        *::-webkit-scrollbar-thumb { background:#333; border-radius:0; }
        body { background:var(--bg); color:var(--fg); font-family:'Noto Sans SC',sans-serif; overflow-x:hidden; cursor:crosshair; }
        body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events:none; z-index:9998; opacity:0.4; }
        ::selection { background:#fff; color:#000; }
        .display { font-family:'Space Grotesk','Noto Sans SC',sans-serif; font-weight:700; letter-spacing:-0.03em; line-height:0.95; }
        .mono { font-family:'Space Grotesk',monospace; font-weight:400; letter-spacing:0.05em; }
        .rule { height:1px; background:var(--line); }
        .rule-v { width:1px; background:var(--line); }
        .grid-bg { background-image:linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size:80px 80px; }
        .reveal-up { opacity:0; transform:translateY(40px); transition:all 1s cubic-bezier(0.16,1,0.3,1); }
        .reveal-up.visible { opacity:1; transform:translateY(0); }
        .mode-section-title { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
        .mode-section-title::before { content:''; width:8px; height:8px; background:var(--paper); transform:rotate(45deg); flex-shrink:0; }
        .zone-card { position:relative; background:var(--graphite); border:1px solid var(--line); padding:18px 22px; transition:all 0.4s cubic-bezier(0.16,1,0.3,1); cursor:pointer; overflow:hidden; display:block; }
        .zone-card::before { content:''; position:absolute; inset:0; background:var(--paper); transform:scaleX(0); transform-origin:left; transition:transform 0.4s cubic-bezier(0.16,1,0.3,1); z-index:0; }
        .zone-card:hover::before { transform:scaleX(1); }
        .zone-card:hover .zone-code, .zone-card:hover .zone-name, .zone-card:hover .zone-tag { color:var(--ink); z-index:1; position:relative; }
        .zone-code { font-family:'Space Grotesk',monospace; font-size:10px; letter-spacing:0.1em; color:var(--muted); display:block; margin-bottom:6px; transition:color 0.3s; }
        .zone-name { font-size:15px; color:var(--paper); transition:color 0.3s; }
        .zone-tag { font-family:'Space Grotesk',monospace; font-size:10px; color:var(--muted); display:block; margin-top:6px; transition:color 0.3s; }
        .act-card { position:relative; background:var(--graphite); border:1px solid var(--line); transition:all 0.4s cubic-bezier(0.16,1,0.3,1); cursor:pointer; overflow:hidden; }
        .act-card:hover { border-color:var(--paper); transform:translateY(-3px); background:var(--charcoal); }
        .act-card .thumb { position:relative; background:var(--fog); overflow:hidden; }
        .act-card .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; filter:grayscale(0.4) contrast(0.95); transition:transform 0.5s ease, filter 0.5s ease; }
        .act-card:hover .thumb img { transform:scale(1.05); filter:grayscale(0) contrast(1.05); }
        .stage-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); color:var(--muted); font-family:'Space Grotesk',monospace; font-size:11px; letter-spacing:0.05em; padding:6px 10px; transition:all 0.3s; }
        .stage-chip:hover { border-color:var(--paper); color:var(--paper); background:rgba(255,255,255,0.05); }
        .stage-chip .sol { color:var(--ash); }
        .stage-chip:hover .sol { color:var(--ink); }
        .cursor-dot { position:fixed; width:8px; height:8px; background:#fff; border-radius:50%; pointer-events:none; z-index:9999; mix-blend-mode:difference; transition:transform 0.15s ease; }
        .cursor-ring { position:fixed; width:40px; height:40px; border:1px solid rgba(255,255,255,0.3); border-radius:50%; pointer-events:none; z-index:9999; transition:all 0.3s ease; }
        .panel { max-height:0; overflow:hidden; transition:max-height 0.6s cubic-bezier(0.16,1,0.3,1); }
        .panel.open { max-height:1200px; }
    </style>

    <style id="theme-css">
        /* ===== V0.17 白昼模式 ===== */
        html.light { --bg:#f4f4f2; --fg:#141414; --muted:#787878; --line:#e2e2df; --hover-bg:#141414; --hover-fg:#f4f4f2; --paper:#141414; --charcoal:#c6c6c3; --smoke:#6a6a68; --graphite:#ececea; --fog:#efefed; --ash:#8a8a88; --acc:#e08f00; --acc-dim:rgba(224,143,0,.10); }
        html.light body { background:var(--bg); color:var(--fg); }
        html.light body::before { filter:invert(1); opacity:.5; }
        html.light *::-webkit-scrollbar-track { background:#ececea; }
        html.light *::-webkit-scrollbar-thumb { background:#c4c4c1; }
        html.light * { scrollbar-color:#c4c4c1 #ececea; }
        html.light #loader { background:#f4f4f2; }
        html.light .grid-bg { background-image:linear-gradient(rgba(0,0,0,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.045) 1px, transparent 1px); }
        html.light .hero-mark { -webkit-text-stroke-color:rgba(0,0,0,.09); }
        html.light .cursor-ring { border-color:rgba(0,0,0,.28); }
        html.light .stat-cell { background:linear-gradient(180deg, rgba(0,0,0,.028), transparent); }
        html.light .latest-card:hover { box-shadow:0 12px 36px rgba(0,0,0,.16), 0 0 0 1px rgba(224,143,0,.28); }
        html.light .bg-ink, html.light .bg-ink\/80, html.light .bg-ink\/90, html.light .bg-ink\/95 { background-color:#f4f4f2; }
        html.light .text-paper { color:#141414; }
        html.light .border-paper, html.light .border-paper\/60 { border-color:#141414; }
        html.light .text-ink { color:#f4f4f2; }
        html.light .text-ash\/60 { color:rgba(20,20,20,.58); }
        html.light .text-ash\/50 { color:rgba(20,20,20,.5); }
        html.light .text-smoke { color:#6a6a68; }
        html.light .border-line, html.light .border-line\/50 { border-color:#e2e2df; }
        html.light .stroke-line { stroke:#e2e2df; }
        html.light .divide-line > :not([hidden]) ~ :not([hidden]) { border-color:#e2e2df; }
        html.light .bg-line, html.light .bg-line\/30, html.light .bg-line\/50 { background-color:#e2e2df; }
        html.light .bg-graphite { background-color:#ececea; }
        html.light .bg-charcoal, html.light .bg-charcoal\/50 { background-color:#d8d8d5; }
        html.light .bg-fog { background-color:#efefed; }
        html.light .bg-paper { background-color:#141414; }
        html.light .bg-black, html.light .bg-black\/70, html.light .bg-black\/80 { background-color:rgba(244,244,242,.92); }
        .theme-overlay { position:fixed; border-radius:50%; transform:scale(0); pointer-events:none; z-index:9999; }
        .theme-overlay.run { animation:themeWipe .55s cubic-bezier(.4,0,.2,1) forwards; }
        @keyframes themeWipe { to { transform:scale(1); } }
        #themeToggle { position:fixed; right:20px; bottom:96px; width:44px; height:44px; z-index:60; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--line); background:var(--fg); color:var(--bg); cursor:pointer; transition:transform .3s ease, background .3s ease, color .3s ease; box-shadow:0 4px 14px rgba(0,0,0,.18); }
        #themeToggle:hover { transform:rotate(180deg) scale(1.06); }
        @media (max-width:768px) { #themeToggle { right:14px; bottom:80px; width:40px; height:40px; } }
    </style>

    <script>
        const MODES_URLS = [
            '/modes.json',
            'https://cdn.jsdelivr.net/gh/ccakenice/bili-sync@main/modes.json',
            'https://raw.githubusercontent.com/ccakenice/bili-sync/main/modes.json'
        ];
        const DATA_URLS = [
            '/latest.json',
            'https://cdn.jsdelivr.net/gh/ccakenice/bili-sync@main/latest.json',
            'https://raw.githubusercontent.com/ccakenice/bili-sync/main/latest.json'
        ];
        const MODE_KEY = 'crisis-contract';

        var CACHE_TTL = 3 * 60 * 60 * 1000;
        function cacheKey(urls) { return 'dgdata_' + ((urls && urls[0]) || 'x').replace(/[^a-z0-9]/gi, ''); }
        async function fetchJSON(urls) {
            var ck = cacheKey(urls);
            try {
                var c = localStorage.getItem(ck);
                if (c) { var o = JSON.parse(c); if (Date.now() - o.t < CACHE_TTL) return o.d; }
            } catch (_) {}
            var res = null;
            for (const url of urls) {
                try {
                    const resp = await fetch(url, { signal: AbortSignal.timeout(10000) });
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    res = await resp.json();
                    break;
                } catch (e) {
                    console.error('数据源失败 ' + url + ':', e.message);
                }
            }
            if (res) { try { localStorage.setItem(ck, JSON.stringify({ t: Date.now(), d: res })); } catch (e) {} }
            return res;
        }

        // 视频匹配：活动关卡按代码(TO-1)，其余按名称包含
        function findVideosFor(it, items) {
            const allText = it.name;
            if (it.stages && it.stages.length) return {}; // 活动类：由关卡 chip 直接链 stage.html
            const names = [it.name, it.name.replace(/^#\d+\s*/, '')];
            return items.filter(v => {
                const txt = v.title + ' ' + (v.pages || []).map(p => p.part).join(' ');
                return names.some(n => txt.includes(n));
            });
        }

        function renderMode(data, items) {
            const wrap = document.getElementById('modeWrap');
            const mode = data.modes.find(m => m.key === MODE_KEY);
            if (!mode) { wrap.innerHTML = '<p class="text-sm text-muted">数据加载失败</p>'; return; }
            const hasStages = mode.groups.some(g => g.items.some(it => it.stages && it.stages.length > 0));
            let html = '';
            mode.groups.forEach((g, gi) => {
                html += `
                    <div class="reveal-up" style="transition-delay:${gi * 0.06}s">
                        <div class="mode-section-title">
                            <span class="display text-2xl md:text-3xl">${g.name}</span>
                            <span class="text-xs text-muted mono tracking-widest">${g.items.length} 项</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">`;
                if (hasStages) {
                    // 活动/主线类：图片卡片，点击展开关卡列表
                    g.items.forEach((it, ii) => {
                        const isCh = it.img && it.img.includes('章节名称');
                        const ratio = isCh ? '1 / 1' : '2.05 / 1';
                        const img = it.img ? `<div class="thumb" style="aspect-ratio:${ratio}" data-fit><img src="${it.img}" alt="${it.name}" loading="lazy" onerror="this.style.display='none'" referrerpolicy="no-referrer" onload="const p=this.parentElement;if(this.naturalWidth&&this.naturalHeight){p.style.aspectRatio=(this.naturalWidth/this.naturalHeight).toFixed(3)+' / 1'}" /></div>` : '';
                        const stageCount = (it.stages || []).length;
                        html += `
                            <div class="act-card reveal-up">
                                ${img}
                                <div class="p-4 border-b border-line">
                                    <span class="zone-code block mb-1">${stageCount} 个关卡</span>
                                    <span class="zone-name">${it.name}</span>
                                </div>
                                <div class="panel" data-panel="${gi}-${ii}">
                                    <div class="p-4 flex flex-wrap gap-2">${(it.stages || []).map(s => `
                                        <a class="stage-chip" href="stage.html?code=${encodeURIComponent(s.code)}">${s.code}<span class="sol">·${s.solutions}解</span></a>`).join('') || '<span class="zone-tag">暂无收录关卡</span>'}
                                    </div>
                                </div>
                            </div>`;
                    });
                } else {
                    // 名称类：直接卡片链接
                    g.items.forEach(it => {
                        const vids = findVideosFor(it, items);
                        const count = vids.length;
                        const href = count > 0 ? `stage.html?name=${encodeURIComponent(it.name)}` : 'javascript:void(0)';
                        const img = it.img ? `<div class="thumb"><img src="${it.img}" alt="${it.name}" loading="lazy" onerror="this.style.display='none'" referrerpolicy="no-referrer" /></div>` : '';
                        html += `
                            <a href="${href}" class="zone-card block ${count > 0 ? '' : 'opacity-50'}">
                                <span class="zone-code">${count > 0 ? count + ' 个视频' : '暂无攻略'}</span>
                                <span class="zone-name">${it.name}</span>
                            </a>`;
                    });
                }
                html += `</div></div>`;
            });
            wrap.innerHTML = html;
            // 活动类点击展开
            document.querySelectorAll('.act-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.stage-chip')) return;
                    const panel = card.querySelector('.panel');
                    panel.classList.toggle('open');
                });
            });
            requestAnimationFrame(() => {
                document.querySelectorAll('.reveal-up').forEach((el, i) => {
                    setTimeout(() => el.classList.add('visible'), 50 + i * 60);
                });
            });
        }

        (async function init() {
            const [modeData, latest] = await Promise.all([fetchJSON(MODES_URLS), fetchJSON(DATA_URLS)]);
            if (modeData && modeData.modes) {
                renderMode(modeData, latest && latest.data || []);
            } else {
                document.getElementById('modeWrap').innerHTML = '<div class="text-center py-20 border border-line/50"><p class="text-sm text-muted">数据加载失败</p></div>';
            }
        })();

        const dot = document.getElementById('cursorDot');
        const ring = document.getElementById('cursorRing');
        let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            dot.style.left = mouseX - 4 + 'px'; dot.style.top = mouseY - 4 + 'px';
        });
        function animateRing() {
            ringX += (mouseX - ringX) * 0.15; ringY += (mouseY - ringY) * 0.15;
            ring.style.left = ringX - 20 + 'px'; ring.style.top = ringY - 20 + 'px';
            requestAnimationFrame(animateRing);
        }
        animateRing();
    </script>

    <script>
        (function () {
            var KEY = 'dgweb_theme';
            var SUN = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></svg>';
            var MOON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/></svg>';
            var root = document.documentElement;
            var btn = document.getElementById('themeToggle');

            function paint() {
                var light = root.classList.contains('light');
                btn.innerHTML = light ? MOON : SUN;
                btn.setAttribute('aria-label', light ? '切换到暗夜' : '切换到白昼');
                btn.setAttribute('aria-pressed', light ? 'true' : 'false');
                btn.setAttribute('title', light ? '黑夜模式' : '白昼模式');
            }

            function setTheme(t) {
                if (t === 'light') root.classList.add('light'); else root.classList.remove('light');
                try { localStorage.setItem(KEY, t); } catch (e) {}
                paint();
            }

            paint();

            btn.addEventListener('click', function (e) {
                var light = root.classList.contains('light');
                var target = light ? 'dark' : 'light';
                var switches = (window.__sw || (window.__sw = []));
                var now = Date.now();
                switches.push(now);
                while (switches.length > 0 && now - switches[0] > 60000) switches.shift();
                if (switches.length >= 4) { window.location.href = 'easter-egg.html'; return; }
                var cx = e.clientX, cy = e.clientY;
                var size = Math.max(window.innerWidth, window.innerHeight) * 2.4;
                var overlay = document.createElement('div');
                overlay.className = 'theme-overlay';
                overlay.style.width = overlay.style.height = size + 'px';
                overlay.style.left = (cx - size / 2) + 'px';
                overlay.style.top = (cy - size / 2) + 'px';
                overlay.style.background = (target === 'light') ? '#f4f4f2' : '#000000';
                document.body.appendChild(overlay);
                var done = false;
                function finish() {
                    if (done) return;
                    done = true;
                    setTheme(target);
                    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                }
                overlay.addEventListener('animationend', finish, { once: true });
                setTimeout(finish, 900);
                requestAnimationFrame(function () { overlay.classList.add('run'); });
            });
        })();
    </script>
</html>
