    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans SC', 'sans-serif'],
                        display: ['Space Grotesk', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        'ink': '#000000', 'paper': '#ffffff', 'ash': '#888888', 'smoke': '#555555',
                        'charcoal': '#333333', 'graphite': '#1a1a1a', 'fog': '#0a0a0a', 'line': '#222222',
                        'acc': '#f5a623',
                    }
                }
            }
        }
    </script>
    <style>
        :root { --bg:#000; --fg:#fff; --muted:#888; --line:#222; --acc:#f5a623; }
        * { margin:0; padding:0; box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#333 #000; }
        *::-webkit-scrollbar { width:4px; }
        *::-webkit-scrollbar-track { background:#000; }
        *::-webkit-scrollbar-thumb { background:#333; border-radius:0; }
        body { background:var(--bg); color:var(--fg); font-family:'Noto Sans SC',sans-serif; overflow-x:hidden; }
        ::selection { background:var(--acc); color:#000; }
        .display { font-family:'Space Grotesk','Noto Sans SC',sans-serif; font-weight:700; letter-spacing:-0.03em; line-height:0.95; }
        .mono { font-family:'Space Grotesk',monospace; font-weight:400; letter-spacing:0.05em; }
        .rule-v { width:1px; background:var(--line); }
        .acc { color:var(--acc); }
        .grid-bg { background-image:linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size:80px 80px; }
        .reveal-up { opacity:0; transform:translateY(40px); transition:all 1s cubic-bezier(0.16,1,0.3,1); }
        .reveal-up.visible { opacity:1; transform:translateY(0); }
        .search-box { display:flex; align-items:center; gap:4px; border:1px solid var(--line); background:var(--fog); transition:border-color .3s ease, box-shadow .3s ease; }
        .search-box:focus-within { border-color:var(--acc); box-shadow:0 0 0 3px rgba(245,166,35,.15), 0 0 30px rgba(245,166,35,.06); }
        .search-box input { background:transparent; border:none; outline:none; color:var(--fg); font-family:'Noto Sans SC',sans-serif; font-size:1rem; letter-spacing:.02em; width:100%; }
        .search-box input::placeholder { color:#444; }
        .result-item { display:flex; gap:20px; border:1px solid var(--line); background:var(--graphite); padding:16px 20px; transition:all .35s cubic-bezier(.16,1,.3,1); }
        .result-item:hover { border-color:var(--acc); transform:translateX(4px); background:var(--charcoal); }
        .rank-no { font-family:'Space Grotesk',sans-serif; font-size:2rem; font-weight:700; color:transparent; -webkit-text-stroke:1px var(--line); line-height:1; transition:color .3s ease, -webkit-text-stroke-color .3s ease; white-space:nowrap; }
        .result-item:hover .rank-no { color:var(--acc); -webkit-text-stroke-color:var(--acc); }
        .score-pill { font-family:'Space Grotesk',monospace; font-size:10px; letter-spacing:.08em; border:1px solid rgba(245,166,35,.4); color:var(--acc); padding:2px 10px; white-space:nowrap; }
        .hit-mark { color:var(--acc); }
        .thumb-box { position:relative; width:200px; height:112px; flex-shrink:0; overflow:hidden; border:1px solid var(--line); background:var(--fog); }
        .thumb-box img { width:100%; height:100%; object-fit:cover; filter:grayscale(.3) contrast(.95); transition:transform .5s ease, filter .5s ease; }
        .result-item:hover .thumb-box img { transform:scale(1.05); filter:grayscale(0) contrast(1.05); }
        .page-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); color:var(--muted); font-family:'Space Grotesk',monospace; font-size:11px; letter-spacing:.05em; padding:5px 10px; transition:all .3s; cursor:pointer; }
        .page-chip:hover { border-color:var(--acc); color:var(--acc); background:rgba(245,166,35,.08); }
        .page-chip .pn { color:var(--ash); }
        .page-chip:hover .pn { color:var(--acc); }
        .cursor-dot { position:fixed; width:8px; height:8px; background:#fff; border-radius:50%; pointer-events:none; z-index:9999; mix-blend-mode:difference; transition:transform 0.15s ease; }
        .cursor-ring { position:fixed; width:40px; height:40px; border:1px solid rgba(255,255,255,0.3); border-radius:50%; pointer-events:none; z-index:9999; transition:all 0.3s ease; }
        .empty-state { border:1px dashed #333; padding:60px 20px; text-align:center; }
    </style></head>

8.png", "年": "https://media.prts.wiki/9/9c/%E5%A4%B4%E5%83%8F_%E5%B9%B4.png", "芬": "https://media.prts.wiki/4/41/%E5%A4%B4%E5%83%8F_%E8%8A%AC.png", "遥": "https://media.prts.wiki/e/ec/%E5%A4%B4%E5%83%8F_%E9%81%A5.png", "令": "https://media.prts.wiki/2/2c/%E5%A4%B4%E5%83%8F_%E4%BB%A4.png", "煌": "https://media.prts.wiki/3/30/%E5%A4%B4%E5%83%8F_%E7%85%8C.png", "锏": "https://media.prts.wiki/0/0f/%E5%A4%B4%E5%83%8F_%E9%94%8F.png", "W": "https://media.prts.wiki/d/d6/%E5%A4%B4%E5%83%8F_W.png", "梅": "https://media.prts.wiki/a/ac/%E5%A4%B4%E5%83%8F_%E6%A2%85.png", "山": "https://media.prts.wiki/e/ec/%E5%A4%B4%E5%83%8F_%E5%B1%B1.png"};

const DATA_URLS = [
    '/latest.json',
    'https://cdn.jsdelivr.net/gh/ccakenice/bili-sync@main/latest.json',
    'https://raw.githubusercontent.com/ccakenice/bili-sync/main/latest.json'
];

let allVideos = [];
const HAN = c => (c >= '\u4e00' && c <= '\u9fff');
const SINGLE_FOLLOW = new Set('单核挂人等双三'.split('')); // 单字名后接这些词视为干员

function scoreMatch(text, name) {
    // name 是 ASCII/英文名：词边界
    if (/^[A-Za-z0-9]+$/.test(name)) {
        const re = new RegExp('(^|[^\\w])' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^\\w])');
        return re.test(text);
    }
    if (name.length === 1) {
        // 单字中文名：左侧非汉字，右侧是白名单词或分隔符
        const i = text.indexOf(name);
        if (i < 0) return false;
        const pre = i > 0 ? text[i - 1] : '';
        const post = i < text.length - 1 ? text[i + 1] : '';
        if (pre && HAN(pre)) return false;
        if (SINGLE_FOLLOW.has(post)) return true;
        return /[\s,、（）()：:「」〔〕／/。，;；0-9]/.test(post) || post === '';
    }
    return text.includes(name);
}

function collectHits(partText) {
    // 长名优先匹配，命中后移除避免短名重复
    let work = partText;
    const hit = [];
    for (const name of POOL) {
        if (scoreMatch(work, name)) {
            hit.push(name);
            work = work.split(name).join('\u0000'.repeat(name.length));
        }
    }
    return hit.map(n => ALIAS[n] || n);
}

async function loadData() {
    for (const url of DATA_URLS) {
        try {
            const resp = await fetch(url, { signal: AbortSignal.timeout(12000) });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const json = await resp.json();
            const list = Array.isArray(json) ? json : (json.data || json.list || json.videos);
            if (Array.isArray(list) && list.length) {
                allVideos = list;
                return;
            }
        } catch (e) { console.error('数据源失败', url, e.message); }
    }
    throw new Error('全部数据源均不可用');
}

// 干员 → 关卡聚合
let opDetails = {};   // { name: [{ stageKey, stage, items: [...] }] }
let opCounts = {};    // { name: 关卡数 }

const STAGE_RE = /(?:[A-Z]{1,3}-(?:[A-Z]{1,3}-\d{1,2}[A-Z]?|\d{1,2}[A-Z]?)|[A-Z]\d{1,2}-\d{1,2}[A-Z]?|\d{1,2}-\d{1,2}[A-Z]?)/;
const STAGE_SKIP_AFTER = '～~-至—';
// 排除剧情体验难度：剧情模式（如"剧情模式9-2"）与 TR 教程关（TO-TR-1 等）
const TR_RE = /[A-Z]{1,3}-TR(?:-\d{1,2})?/;

function isPlotPart(part) {
    return part.indexOf('剧情') >= 0 || TR_RE.test(part);
}

function stageKey(part, title) {
    for (const txt of [part, title]) {
        const m = STAGE_RE.exec(txt);
        if (!m) continue;
        const after = m.index + m[0].length < txt.length ? txt.charAt(m.index + m[0].length) : '';
        if (after && STAGE_SKIP_AFTER.indexOf(after) >= 0) continue;
        return { key: m[0], stage: m[0] };
    }
    return null;
}

function buildStats() {
    opDetails = {}; opCounts = {};
    for (const v of allVideos) {
        const pages = v.pages || [];
        if (!pages.length) continue;
        const isMulti = pages.length > 1;
        const bvid = v.bvid || '';
        for (let i = 0; i < pages.length; i++) {
            const p = pages[i];
            const part = (p.part || '').trim();
            // 排除剧情体验难度（剧情模式 / TR 教程关）
            if (isPlotPart(part)) continue;
            // 单P视频：把视频主标题也纳入
            const text = (!isMulti ? (v.title || '') + ' ' + part : part);
            if (!text.trim()) continue;
            const hits = collectHits(text);
            const sk = stageKey(part, v.title || '');
            const stageKeyVal = sk ? sk.key : bvid + ':' + (p.page || i + 1);
            const stageLabel = sk ? sk.stage : (part || '(无标题)');
            for (const n of hits) {
                opDetails[n] = opDetails[n] || [];
                let entry = opDetails[n].find(e => e.stageKey === stageKeyVal);
                if (!entry) {
                    entry = { stageKey: stageKeyVal, stage: stageLabel, items: [] };
                    opDetails[n].push(entry);
                }
                entry.items.push({
                    bvid, title: v.title || '', part: p.part || '',
                    page: p.page || i + 1, dur: p.duration || (isMulti ? '' : v.duration || '')
                });
            }
        }
    }
    // 汇总：每干员 = 独立关卡数
    for (const n in opDetails) {
        opCounts[n] = opDetails[n].length;
    }
}

function renderList() {
    const rows = Object.entries(opCounts).sort((a, b) => b[1] - a[1]);
    const max = rows.length ? rows[0][1] : 1;
    const list = document.getElementById('opList');
    list.innerHTML = rows.map(([name, cnt], idx) => {
        const av = AVATARS[name] || '';
        return `
        <div class="row ${idx < 3 ? 'top3' : ''}" data-name="${name}">
            <span class="no">${String(idx + 1).padStart(2, '0')}</span>
            <span class="av"><img src="${av}" loading="lazy" alt="${name}" onerror="this.style.display='none'"/></span>
            <span class="nm">${name}</span>
            <span class="bar"><i style="width:${(cnt / max * 100).toFixed(1)}%"></i></span>
            <span class="cnt">${cnt} 次</span>
            <span class="pct">${(cnt / Object.keys(opDetails).reduce((s, k) => s + opDetails[k].length, 0) * 100).toFixed(1)}%</span>
            <span class="go">详情 →</span>
        </div>`;
    }).join('');
}

function showDetail(name) {
    const groups = opDetails[name] || [];
    const panel = document.getElementById('detailPanel');
    document.getElementById('detailTitle').textContent = name;
    document.getElementById('detailCount').textContent = groups.length + ' 个关卡';
    document.getElementById('detailStats').innerHTML = groups.map(g => {
        const cnt = g.items.length;
        const multi = cnt > 1;
        let links = '';
if (multi) {
            links = '<div class="d-links">' + g.items.map(it => `
                <a class="d-link" href="detail.html?bvid=${encodeURIComponent(it.bvid)}&page=${it.page}" title="${it.part || it.title || ''}"><span class="d-av2"><img src="${AVATARS[name]}" loading="lazy" onerror="this.style.display='none'"/></span>${it.part || it.title || ''} <span class="d-page">P${it.page}</span></a>`).join('') + '</div>';
        } else {
            const it = g.items[0];
            links = `<a class="d-item" href="detail.html?bvid=${encodeURIComponent(it.bvid)}&page=${it.page}">
                <span class="d-av"><img src="${AVATARS[name]}" loading="lazy" onerror="this.style.display='none'"/></span>
                <span class="d-body">
                    <span class="d-part">${it.part || it.title || ''}</span>
                    <span class="d-meta">${it.title || ''}</span>
                </span>
                <span class="d-page">P${it.page}</span>
                <span class="d-go">进入 →</span>
            </a>`;
        }
        return `
        <div class="d-group">
            <div class="d-group-head">
                <span class="d-stage">${g.stage}</span>
                <span class="d-stage-cnt">${cnt} 个来源${multi ? '' : ''}</span>
            </div>
            ${links}
        </div>`;
    }).join('');
    panel.style.display = 'flex';
}

function closeDetail() { document.getElementById('detailPanel').style.display = 'none'; }

document.getElementById('opList').addEventListener('click', function (ev) {
    const row = ev.target.closest('.row');
    if (row) showDetail(row.getAttribute('data-name'));
});

(async function init() {
    try {
        await loadData();
        buildStats();
        renderList();
        document.getElementById('loadingState').style.display = 'none';
    } catch (e) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display = 'block';
        document.getElementById('errMsg').textContent = e.message;
    }
})();
    </script>
