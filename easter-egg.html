<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>▓▓▓▓▓</title>
    <style>
        html, body { height:100%; margin:0; background:#000; overflow:hidden; cursor:crosshair; font-family:'PingFang SC','Microsoft YaHei','Microsoft YaHei',sans-serif; color:#fff; }
        .scene { display:flex; flex-direction:column; height:100vh; }
        .seg { flex:1; position:relative; }
        .red { background:#7a0c0c; }
        .line { position:absolute; top:50%; left:50%; transform:translate(-50%,-40%); text-align:center; font-size:clamp(1rem,3.4vw,1.9rem); font-weight:500; letter-spacing:.14em; color:rgba(255,255,255,.94); opacity:0; white-space:nowrap; }
        .line.show { animation:rise 1.3s cubic-bezier(.16,1,.3,1) forwards; }
        @keyframes rise { from { opacity:0; transform:translate(-50%,-42%); } to { opacity:1; transform:translate(-50%,-50%); } }
        .dots { position:absolute; display:flex; align-items:center; gap:5px; pointer-events:none; opacity:0; }
        .dots.pop { animation:dotIn 0.8s ease forwards; }
        .dots .dot { display:block; border-radius:50%; background:#fff; }
        @keyframes dotIn { from { opacity:0; } to { opacity:1; } }
        .choices { position:absolute; top:62%; left:50%; transform:translate(-50%,-50%); display:flex; gap:3rem; opacity:0; pointer-events:none; z-index:40; }
        .choices.show { opacity:1; pointer-events:auto; transition:opacity .5s ease; }
        .choice { border:1px solid rgba(255,255,255,.45); padding:.75rem 2.8rem; font-size:1.05rem; letter-spacing:.35em; cursor:pointer; user-select:none; transition:all .3s ease; }
        .choice:hover { border-color:#fff; background:rgba(255,255,255,.1); }
        .blackout { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; display:flex; align-items:center; justify-content:center; z-index:60; transition:opacity 1.3s ease; }
        .blackout.on { opacity:1; pointer-events:auto; }
        .final { opacity:0; transition:opacity 1.3s ease 1.1s; font-size:clamp(1.15rem,4.2vw,2.3rem); letter-spacing:.28em; text-align:center; font-weight:500; }
        .final.show { opacity:1; }
        .hint { position:fixed; bottom:18px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:.25em; color:rgba(255,255,255,.28); z-index:70; }
    </style>
</head>
<body>
    <div class="scene">
        <div class="seg"></div>
        <div class="seg red"><div class="line" id="question">是否确认关闭全舰防御系统？</div></div>
        <div class="seg"></div>
    </div>
    <div class="choices" id="choices">
        <div class="choice" id="yes">是</div>
        <div class="choice" id="no">否</div>
    </div>
    <div class="blackout" id="blackout"><div class="final" id="final"></div></div>
    <div class="hint">—— 系统静默待机 ——</div>
    <audio id="bgm" loop preload="auto" src="easter-storyteller.mp3"></audio>

    <script>
        (function () {
            var q = document.getElementById('question');
            var segs = document.querySelectorAll('.scene .seg:not(.red)');
            var choices = document.getElementById('choices');
            var blackout = document.getElementById('blackout');
            var finalEl = document.getElementById('final');
            var audio = document.getElementById('bgm');
            var answered = false;
            var armed = false;
            var musicStarted = false;

            function tryPlayMusic() {
                if (musicStarted) return;
                musicStarted = true;
                var pr = audio.play();
                if (pr && pr.catch) pr.catch(function () {});
            }
            tryPlayMusic();
            document.addEventListener('pointerdown', function () { tryPlayMusic(); });

            setTimeout(function () { q.classList.add('show'); }, 500);

            var dotTimer = setInterval(function () {
                if (answered) return;
                var seg = segs[Math.floor(Math.random() * segs.length)];
                var d = document.createElement('div');
                d.className = 'dots';
                for (var i = 0; i < 6; i++) {
                    var dot = document.createElement('span');
                    dot.className = 'dot';
                    var s = 6 * (1 + Math.random() * 0.2);
                    dot.style.width = dot.style.height = s + 'px';
                    d.appendChild(dot);
                }
                d.style.left = (Math.random() * 86 + 7) + '%';
                d.style.top = (Math.random() * 78 + 11) + '%';
                seg.appendChild(d);
                d.classList.add('pop');
            }, 1000);

            setTimeout(function () { armed = true; }, 4400);

            document.addEventListener('click', function () {
                if (armed && !answered && !choices.classList.contains('show')) {
                    choices.classList.add('show');
                }
            });

            function done(text) {
                if (answered) return;
                answered = true;
                choices.classList.remove('show');
                blackout.classList.add('on');
                setTimeout(function () {
                    finalEl.textContent = text;
                    finalEl.classList.add('show');
                }, 1400);
                setTimeout(function () { window.location.href = 'index.html'; }, 7000);
            }

            document.getElementById('yes').addEventListener('click', function () { done('\u505a\u5f97\u597d\uff0c\u9884\u8a00\u5bb6\u3002'); });
            document.getElementById('no').addEventListener('click', function () { done('\u8c22\u8c22\u4f60\uff0c\u535a\u58eb'); });
        })();
    </script>
<script src="js/img-progressive.js"></script>
</body>
</html>
