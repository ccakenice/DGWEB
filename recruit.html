    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans SC', 'sans-serif'],
                        display: ['Space Grotesk', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        'ink': '#000000', 'paper': '#ffffff', 'ash': '#888888', 'smoke': '#555555',
                        'charcoal': '#333333', 'graphite': '#1a1a1a', 'fog': '#0a0a0a', 'line': '#222222',
                        'acc': '#f5a623',
                    }
                }
            }
        }
    </script>
    <style>
        :root { --bg:#000; --fg:#fff; --muted:#888; --line:#222; --acc:#f5a623; }
        * { margin:0; padding:0; box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#333 #000; }
        *::-webkit-scrollbar { width:4px; }
        *::-webkit-scrollbar-track { background:#000; }
        *::-webkit-scrollbar-thumb { background:#333; border-radius:0; }
        body { background:var(--bg); color:var(--fg); font-family:'Noto Sans SC',sans-serif; overflow-x:hidden; }
        ::selection { background:var(--acc); color:#000; }
        .display { font-family:'Space Grotesk','Noto Sans SC',sans-serif; font-weight:700; letter-spacing:-0.03em; line-height:0.95; }
        .mono { font-family:'Space Grotesk',monospace; font-weight:400; letter-spacing:0.05em; }
        .rule-v { width:1px; background:var(--line); }
        .acc { color:var(--acc); }
        .grid-bg { background-image:linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size:80px 80px; }
        .reveal-up { opacity:0; transform:translateY(40px); transition:all 1s cubic-bezier(0.16,1,0.3,1); }
        .reveal-up.visible { opacity:1; transform:translateY(0); }
        .search-box { display:flex; align-items:center; gap:4px; border:1px solid var(--line); background:var(--fog); transition:border-color .3s ease, box-shadow .3s ease; }
        .search-box:focus-within { border-color:var(--acc); box-shadow:0 0 0 3px rgba(245,166,35,.15), 0 0 30px rgba(245,166,35,.06); }
        .search-box input { background:transparent; border:none; outline:none; color:var(--fg); font-family:'Noto Sans SC',sans-serif; font-size:1rem; letter-spacing:.02em; width:100%; }
        .search-box input::placeholder { color:#444; }
        .result-item { display:flex; gap:20px; border:1px solid var(--line); background:var(--graphite); padding:16px 20px; transition:all .35s cubic-bezier(.16,1,.3,1); }
        .result-item:hover { border-color:var(--acc); transform:translateX(4px); background:var(--charcoal); }
        .rank-no { font-family:'Space Grotesk',sans-serif; font-size:2rem; font-weight:700; color:transparent; -webkit-text-stroke:1px var(--line); line-height:1; transition:color .3s ease, -webkit-text-stroke-color .3s ease; white-space:nowrap; }
        .result-item:hover .rank-no { color:var(--acc); -webkit-text-stroke-color:var(--acc); }
        .score-pill { font-family:'Space Grotesk',monospace; font-size:10px; letter-spacing:.08em; border:1px solid rgba(245,166,35,.4); color:var(--acc); padding:2px 10px; white-space:nowrap; }
        .hit-mark { color:var(--acc); }
        .thumb-box { position:relative; width:200px; height:112px; flex-shrink:0; overflow:hidden; border:1px solid var(--line); background:var(--fog); }
        .thumb-box img { width:100%; height:100%; object-fit:cover; filter:grayscale(.3) contrast(.95); transition:transform .5s ease, filter .5s ease; }
        .result-item:hover .thumb-box img { transform:scale(1.05); filter:grayscale(0) contrast(1.05); }
        .page-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); color:var(--muted); font-family:'Space Grotesk',monospace; font-size:11px; letter-spacing:.05em; padding:5px 10px; transition:all .3s; cursor:pointer; }
        .page-chip:hover { border-color:var(--acc); color:var(--acc); background:rgba(245,166,35,.08); }
        .page-chip .pn { color:var(--ash); }
        .page-chip:hover .pn { color:var(--acc); }
        .cursor-dot { position:fixed; width:8px; height:8px; background:#fff; border-radius:50%; pointer-events:none; z-index:9999; mix-blend-mode:difference; transition:transform 0.15s ease; }
        .cursor-ring { position:fixed; width:40px; height:40px; border:1px solid rgba(255,255,255,0.3); border-radius:50%; pointer-events:none; z-index:9999; transition:all 0.3s ease; }
        .empty-state { border:1px dashed #333; padding:60px 20px; text-align:center; }
    </style></head>

%95%E6%8B%89%E6%96%AF.png"}, {"name": "水月", "rarity": 5, "tags": ["特种", "输出", "控场"], "lock": "/", "profession": "特种", "position": "近战位", "avatar": "https://media.prts.wiki/0/05/%E5%A4%B4%E5%83%8F_%E6%B0%B4%E6%9C%88.png"}];
let selected = new Set();
const tagBox = document.getElementById('tagBox');
const resultBox = document.getElementById('resultBox');
const resultCount = document.getElementById('resultCount');

// 渲染词条
tagBox.innerHTML = RECRUIT_TAGS.map(t =>
    `<span class="r-tag" data-tag="${t}" onclick="toggleTag('${t}')">${t}</span>`).join('');

function toggleTag(t) {
    if (selected.has(t)) selected.delete(t);
    else selected.add(t);
    render();
}

function render() {
    const sel = [...selected];
    // 更新 tag 样式
    document.querySelectorAll('.r-tag').forEach(el => {
        const t = el.dataset.tag;
        el.classList.toggle('on', selected.has(t));
        // 若已选词条无组合可能 → 划线提示（简化：不实现）
    });
    // 匹配干员：职业/位置/特性词条 + 资深按稀有度
    const matched = sel.length ? RECRUIT_OPS.filter(o => {
        return sel.every(t => {
            if (t === '资深干员') return o.rarity >= 4;
            if (t === '高级资深干员') return o.rarity >= 5;
            if (t === '近战位' || t === '远程位') return o.position === t;
            if (t.endsWith('干员') && t !== '支援机械') {
                const prof = t.replace('干员', '');
                return o.profession === prof;
            }
            return o.tags.includes(t);
        });
    }).sort((a, b) => b.rarity - a.rarity) : [];
    resultCount.textContent = matched.length ? `(${matched.length} 名)` : '';
    resultBox.innerHTML = matched.length ? matched.map(o => {
        const isLock = sel.length && sel.every(t => o.lock.includes(t));
        return `
        <div class="r-op ${isLock ? 'lock' : ''}">
            <img src="${o.avatar}" loading="lazy" onerror="this.style.display='none'"/>
            <div class="r-name">${o.name}${isLock ? ' <span class="r-locktag">锁定</span>' : ''}</div>
            <div class="r-star">${o.rarity + 1}★</div>
        </div>`;
    }).join('') : '<div class="r-empty">选择词条后显示结果</div>';
}

// 截图识别
let shotFile = null;
let ocrWorker = null;
const shotZone = document.getElementById('shotZone');
const shotPreview = document.getElementById('shotPreview');

function setShot(f) {
    if (!f || !f.type.startsWith('image/')) return;
    shotFile = f;
    const url = URL.createObjectURL(f);
    shotPreview.src = url;
    shotPreview.style.display = 'block';
    document.getElementById('ocrStatus').textContent = '已载入截图，点击「识别 TAG」';
}

// 拖拽
shotZone.addEventListener('dragover', e => { e.preventDefault(); shotZone.classList.add('drag'); });
shotZone.addEventListener('dragleave', () => shotZone.classList.remove('drag'));
shotZone.addEventListener('drop', e => {
    e.preventDefault();
    shotZone.classList.remove('drag');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) setShot(f);
});
// 粘贴
document.addEventListener('paste', e => {
    const items = (e.clipboardData || {}).items;
    if (!items) return;
    for (const it of items) {
        if (it.type.startsWith('image/')) {
            const f = it.getAsFile();
            if (f) { setShot(f); e.preventDefault(); return; }
        }
    }
});
// 文件选择
document.getElementById('shotFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) setShot(f);
});

// 语言包从本站加载（CF CDN，快）；页面加载即预加载，避免首次识别等待
function initOcr() {
    const status = document.getElementById('ocrStatus');
    status.textContent = '正在加载 OCR 引擎与语言包（首次约 20MB，请稍候）…';
    Tesseract.createWorker('chi_sim', 1, {
        langPath: 'https://dgwebq.pages.dev/',
        logger: m => {
            if (m.status === 'loading tesseract core') status.textContent = '加载 OCR 引擎…';
            else if (m.status === 'initializing tesseract') status.textContent = '初始化引擎…';
            else if (m.status === 'loading language traineddata') status.textContent = '下载语言包 ' + Math.round(m.progress * 100) + '%';
            else if (m.status === 'initializing api') status.textContent = '准备就绪，可上传截图识别';
        }
    }).then(w => {
        ocrWorker = w;
        status.textContent = 'OCR 已就绪';
    }).catch(e => {
        status.textContent = 'OCR 引擎加载失败：' + e.message + '（可手动选择词条）';
    });
}
initOcr();

async function recognizeShot() {
    const file = shotFile || document.getElementById('shotFile').files[0];
    if (!file) { document.getElementById('ocrStatus').textContent = '请先选择/拖入/粘贴截图'; return; }
    if (!ocrWorker) { document.getElementById('ocrStatus').textContent = 'OCR 引擎尚未就绪，请稍候…'; return; }
    const status = document.getElementById('ocrStatus');
    const btn = document.getElementById('ocrBtn');
    btn.disabled = true;
    status.textContent = '识别中…';
    try {
        const { data } = await ocrWorker.recognize(file);
        const rawText = (data.text || '');
        const text = rawText.replace(/[\s　]+/g, '');  // 去空白
        status.textContent = '识别完成';
        // 模糊匹配词条：精确包含 或 允许 1 字差异
        const found = RECRUIT_TAGS.filter(t => {
            if (text.includes(t)) return true;
            // 逐字匹配：OCR 文本中是否有与词条相似度高的片段
            for (let i = 0; i <= text.length - t.length; i++) {
                const seg = text.slice(i, i + t.length);
                let diff = 0;
                for (let k = 0; k < t.length; k++) {
                    if (seg[k] !== t[k]) diff++;
                    if (diff > 1) break;
                }
                if (diff <= 1) return true;
            }
            return false;
        });
        found.forEach(t => selected.add(t));
        render();
        if (found.length) {
            status.textContent = '识别到词条：' + (found.join('、'));
        } else {
            status.textContent = '未能识别到词条，识别原文：' + rawText.replace(/\n/g, ' ').slice(0, 60) + '…（可手动选择）';
        }
    } catch (e) {
        status.textContent = '识别失败：' + e.message;
    }
    btn.disabled = false;
}

render();
