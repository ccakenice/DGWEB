    <style id="theme-css">
        /* ===== V0.17 白昼模式 ===== */
        html.light { --bg:#f4f4f2; --fg:#141414; --muted:#787878; --line:#e2e2df; --hover-bg:#141414; --hover-fg:#f4f4f2; --paper:#141414; --charcoal:#c6c6c3; --smoke:#6a6a68; --graphite:#ececea; --fog:#efefed; --ash:#8a8a88; --acc:#e08f00; --acc-dim:rgba(224,143,0,.10); }
        html.light body { background:var(--bg); color:var(--fg); }
        html.light body::before { filter:invert(1); opacity:.5; }
        html.light *::-webkit-scrollbar-track { background:#ececea; }
        html.light *::-webkit-scrollbar-thumb { background:#c4c4c1; }
        html.light * { scrollbar-color:#c4c4c1 #ececea; }
        html.light #loader { background:#f4f4f2; }
        html.light .grid-bg { background-image:linear-gradient(rgba(0,0,0,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.045) 1px, transparent 1px); }
        html.light .hero-mark { -webkit-text-stroke-color:rgba(0,0,0,.09); }
        html.light .cursor-ring { border-color:rgba(0,0,0,.28); }
        html.light .stat-cell { background:linear-gradient(180deg, rgba(0,0,0,.028), transparent); }
        html.light .latest-card:hover { box-shadow:0 12px 36px rgba(0,0,0,.16), 0 0 0 1px rgba(224,143,0,.28); }
        html.light .bg-ink, html.light .bg-ink\/80, html.light .bg-ink\/90, html.light .bg-ink\/95 { background-color:#f4f4f2; }
        html.light .text-paper { color:#141414; }
        html.light .border-paper, html.light .border-paper\/60 { border-color:#141414; }
        html.light .text-ink { color:#f4f4f2; }
        html.light .text-ash\/60 { color:rgba(20,20,20,.58); }
        html.light .text-ash\/50 { color:rgba(20,20,20,.5); }
        html.light .text-smoke { color:#6a6a68; }
        html.light .border-line, html.light .border-line\/50 { border-color:#e2e2df; }
        html.light .stroke-line { stroke:#e2e2df; }
        html.light .divide-line > :not([hidden]) ~ :not([hidden]) { border-color:#e2e2df; }
        html.light .bg-line, html.light .bg-line\/30, html.light .bg-line\/50 { background-color:#e2e2df; }
        html.light .bg-graphite { background-color:#ececea; }
        html.light .bg-charcoal, html.light .bg-charcoal\/50 { background-color:#d8d8d5; }
        html.light .bg-fog { background-color:#efefed; }
        html.light .bg-paper { background-color:#141414; }
        html.light .bg-black, html.light .bg-black\/70, html.light .bg-black\/80 { background-color:rgba(244,244,242,.92); }
        .theme-overlay { position:fixed; border-radius:50%; transform:scale(0); pointer-events:none; z-index:9999; }
        .theme-overlay.run { animation:themeWipe .55s cubic-bezier(.4,0,.2,1) forwards; }
        @keyframes themeWipe { to { transform:scale(1); } }
        #themeToggle { position:fixed; right:20px; bottom:96px; width:44px; height:44px; z-index:60; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--line); background:var(--fg); color:var(--bg); cursor:pointer; transition:transform .3s ease, background .3s ease, color .3s ease; box-shadow:0 4px 14px rgba(0,0,0,.18); }
        #themeToggle:hover { transform:rotate(180deg) scale(1.06); }
        @media (max-width:768px) { #themeToggle { right:14px; bottom:80px; width:40px; height:40px; } }
    </style>

    <script>
        const DATA_URLS = [
            '/latest.json',
            'https://cdn.jsdelivr.net/gh/ccakenice/bili-sync@main/latest.json',
            'https://raw.githubusercontent.com/ccakenice/bili-sync/main/latest.json'
        ];
        const MODES_URLS = [
            '/modes.json',
            'https://cdn.jsdelivr.net/gh/ccakenice/bili-sync@main/modes.json',
            'https://raw.githubusercontent.com/ccakenice/bili-sync/main/modes.json'
        ];

        function fmtDuration(sec) {
            sec = Number(sec) || 0;
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return m + ':' + String(s).padStart(2, '0');
        }

        function fmtCount(n) {
            n = Number(n) || 0;
            if (n >= 100000000) return (n / 100000000).toFixed(1) + '亿';
            if (n >= 10000) return (n / 10000).toFixed(1) + '万';
            return String(n);
        }

        var CACHE_TTL = 3 * 60 * 60 * 1000;
        function cacheKey(urls) { return 'dgdata_' + ((urls && urls[0]) || 'x').replace(/[^a-z0-9]/gi, ''); }
        async function fetchJSON(urls) {
            var ck = cacheKey(urls);
            try {
                var c = localStorage.getItem(ck);
                if (c) { var o = JSON.parse(c); if (Date.now() - o.t < CACHE_TTL) return o.d; }
            } catch (_) {}
            var res = null;
            for (const url of urls) {
                try {
                    const resp = await fetch(url, { signal: AbortSignal.timeout(10000) });
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    res = await resp.json();
                    break;
                } catch (e) {
                    console.error('数据源失败 ' + url + ':', e.message);
                }
            }
            if (res) { try { localStorage.setItem(ck, JSON.stringify({ t: Date.now(), d: res })); } catch (e) {} }
            return res;
        }

        function isObsolete(part) {
            return /旧版|不用看|参考版/.test(part);
        }

        function normalizeCode(c) {
            let s = c.toUpperCase();
            let m;
            m = s.match(/^([A-Z]{1,4})-?(EX)-?(\d+[A-Z]?)$/);
            if (m) return m[1] + '-' + m[2] + '-' + m[3];
            m = s.match(/^([A-Z]{1,4})-?(MO)-?(\d+[A-Z]?)$/);
            if (m) return m[1] + '-' + m[2] + '-' + m[3];
            m = s.match(/^([A-Z]{1,4})-S(\d+[A-Z]?)$/);
            if (m) return m[1] + '-S-' + m[2];
            return s;
        }

        function normCode(c) {
            return normalizeCode(c).replace(/^([A-Z]+)-?0+(\d)/, '$1-$2');
        }

        function matchCode(part) {
            let m = part.trim().toUpperCase().match(/^([A-Za-z]{1,4}-?(?:EX|S|MO)?-?\d+[A-Za-z]?|[A-Za-z]{1,4}|\d{1,2}-\d{1,2}[A-Za-z]?)/);
            if (!m) m = part.trim().toUpperCase().match(/[\(（]\s*([A-Za-z]{1,4}-?(?:EX|S|MO)?-?\d+[A-Za-z]?)[^\)）]*[\)）]/);
            return m ? normalizeCode(m[1]) : '';
        }

        function solCard(sol, idx) {
            const cn = ['一解', '二解', '三解', '四解', '五解', '六解', '七解', '八解', '九解', '十解'];
            const label = cn[idx] || ('方案' + (idx + 1));
            return `
                <div class="sol-card p-5 md:p-6">
                    <div class="flex items-center justify-between gap-4 mb-4">
                        <div class="flex items-center gap-3">
                            <span class="mono text-[10px] border border-line px-2.5 py-1 text-paper tracking-widest">${label}</span>
                            <span class="mono text-[10px] text-muted">P${sol.page}</span>
                        </div>
                        <span class="mono text-[10px] text-smoke">${fmtDuration(sol.duration)}</span>
                    </div>
                    <div class="relative bg-fog border border-line overflow-hidden mb-4" style="padding-bottom:56.25%">
                        <iframe src="https://player.bilibili.com/player.html?bvid=${sol.bvid}&page=${sol.page}&high_quality=1"
                            class="absolute inset-0 w-full h-full" scrolling="no" border="0" frameborder="no"
                            allowfullscreen="true" allow="fullscreen; picture-in-picture" referrerpolicy="no-referrer"></iframe>
                    </div>
                    <div class="text-sm text-paper leading-relaxed mb-2">${sol.part}</div>
                    <div class="text-xs text-muted leading-snug line-clamp-2 mb-3">${sol.vtitle}</div>
                    <div class="flex items-center justify-between">
                        <a href="detail.html?bvid=${sol.bvid}" class="mono text-[10px] text-muted hover:text-paper transition-colors tracking-widest">完整视频 ↗</a>
                        <a href="https://www.bilibili.com/video/${sol.bvid}?p=${sol.page}" target="_blank" class="mono text-[10px] text-paper hover:text-muted transition-colors tracking-widest">B站观看 ↗</a>
                    </div>
                </div>`;
        }

        function renderStage(stageCode, items, stageName) {
            const wrap = document.getElementById('stageWrap');
            const stageCodeUp = stageCode.toUpperCase();
            const nameKeys = stageName ? [stageName, stageName.replace(/^#\d+\s*/, '')] : [];
            const sols = [];
            for (const it of items) {
                const allText = it.title + ' ' + (it.pages || []).map(p => p.part).join(' ');
                if (nameKeys.length && nameKeys.some(k => allText.includes(k))) {
                    // 按地图名匹配整个视频的对应分P：取第一个分P（剿灭一般单P），如多P取含名称的分P
                    const matchedPages = (it.pages || []).filter(p => !isObsolete(p.part));
                    const page = matchedPages.length ? matchedPages[0] : { page: 1 };
                    sols.push({ bvid: it.bvid, page: page.page, part: page.part || it.title, duration: page.duration, vtitle: it.title, link: it.link });
                    continue;
                }
                for (const p of it.pages || []) {
                    if (isObsolete(p.part)) continue;
                    if (normCode(matchCode(p.part)) === normCode(stageCode)) {
                        sols.push({ bvid: it.bvid, page: p.page, part: p.part, duration: p.duration, vtitle: it.title, link: it.link });
                    }
                }
            }
            const titleStr = stageName || stageCodeUp;
            if (sols.length === 0) {
                wrap.innerHTML = `
                    <div class="text-center py-24 border border-line/50 grid-bg">
                        <div class="mono text-xs text-muted tracking-[0.3em] uppercase block mb-4">Stage</div>
                        <div class="display text-4xl md:text-6xl mb-8">${titleStr}</div>
                        <p class="text-sm text-muted mb-8">该关卡暂无收录攻略，或数据尚未同步。</p>
                        <div class="flex justify-center gap-4">
                            <a href="modes.html" class="mono text-xs text-muted hover:text-paper transition-colors border border-line hover:border-paper px-6 py-3">返回模式页</a>
                            <a href="https://space.bilibili.com/3546373951588920" target="_blank" class="mono text-xs text-muted hover:text-paper transition-colors border border-line hover:border-paper px-6 py-3">前往B站空间</a>
                        </div>
                    </div>`;
                document.title = titleStr + ' — 低配挂机研讨会';
                return;
            }
            wrap.innerHTML = `
                <a href="javascript:history.back()" class="mono text-xs text-muted hover:text-paper transition-colors tracking-widest uppercase flex items-center gap-2 mb-8">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18"/></svg>
                    返回
                </a>
                <div class="reveal-up mb-10">
                    <span class="mono text-xs text-muted tracking-[0.3em] uppercase block mb-4">Stage Guide</span>
                    <h1 class="display text-4xl md:text-7xl mb-6">${titleStr}</h1>
                    <div class="flex flex-wrap items-center gap-3 text-xs text-muted mono tracking-widest">
                        <span>${sols.length} 个解法方案</span>
                        <span class="w-px h-3 bg-line"></span>
                        <span>低配挂机研讨会</span>
                    </div>
                </div>
                <div class="grid md:grid-cols-2 gap-5">
                    ${sols.map((s, i) => solCard(s, i)).join('')}
                </div>`;
            document.title = stageCodeUp + ' 攻略 — 低配挂机研讨会';
            requestAnimationFrame(() => {
                document.querySelectorAll('.reveal-up').forEach((el, i) => {
                    setTimeout(() => el.classList.add('visible'), 50 + i * 80);
                });
            });
        }

        function renderError() {
            const wrap = document.getElementById('stageWrap');
            wrap.innerHTML = `
                <div class="text-center py-24 border border-line/50 grid-bg">
                    <p class="text-sm text-muted mb-6">数据加载失败，请稍后重试</p>
                    <a href="index.html" class="mono text-xs text-muted hover:text-paper transition-colors border border-line hover:border-paper px-6 py-3 inline-block">返回主页</a>
                </div>`;
        }

        (async function init() {
            const params = new URLSearchParams(location.search);
            const code = params.get('code') || '';
            const name = params.get('name') || '';
            if (!code && !name) { renderError(); return; }
            const json = await fetchJSON(DATA_URLS);
            const items = json && json.data;
            if (!items) { renderError(); return; }
            renderStage(code || 'ANN', items, name);
        })();
    </script>

    <script>
    (function () {
        var btn = document.getElementById('navToggle');
        var menu = document.getElementById('mobileMenu');
        if (!btn || !menu) return;
        btn.addEventListener('click', function () {
            var open = menu.classList.toggle('hidden') === false;
            btn.classList.toggle('open', open);
            btn.setAttribute('aria-expanded', String(open));
        });
        menu.querySelectorAll('a').forEach(function (a) {
            a.addEventListener('click', function () {
                menu.classList.add('hidden');
                btn.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
            });
        });
    })();
    </script>

    <button id="themeToggle" aria-label="切换到白昼" aria-pressed="false" title="白昼模式"></button>
    <script>
        (function () {
            var KEY = 'dgweb_theme';
            var SUN = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></svg>';
            var MOON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/></svg>';
            var root = document.documentElement;
            var btn = document.getElementById('themeToggle');

            function paint() {
                var light = root.classList.contains('light');
                btn.innerHTML = light ? MOON : SUN;
                btn.setAttribute('aria-label', light ? '切换到暗夜' : '切换到白昼');
                btn.setAttribute('aria-pressed', light ? 'true' : 'false');
                btn.setAttribute('title', light ? '黑夜模式' : '白昼模式');
            }

            function setTheme(t) {
                if (t === 'light') root.classList.add('light'); else root.classList.remove('light');
                try { localStorage.setItem(KEY, t); } catch (e) {}
                paint();
            }

            paint();

            btn.addEventListener('click', function (e) {
                var light = root.classList.contains('light');
                var target = light ? 'dark' : 'light';
                var switches = (window.__sw || (window.__sw = []));
                var now = Date.now();
                switches.push(now);
                while (switches.length > 0 && now - switches[0] > 60000) switches.shift();
                if (switches.length >= 4) { window.location.href = 'easter-egg.html'; return; }
                var cx = e.clientX, cy = e.clientY;
                var size = Math.max(window.innerWidth, window.innerHeight) * 2.4;
                var overlay = document.createElement('div');
                overlay.className = 'theme-overlay';
                overlay.style.width = overlay.style.height = size + 'px';
                overlay.style.left = (cx - size / 2) + 'px';
                overlay.style.top = (cy - size / 2) + 'px';
                overlay.style.background = (target === 'light') ? '#f4f4f2' : '#000000';
                document.body.appendChild(overlay);
                var done = false;
                function finish() {
                    if (done) return;
                    done = true;
                    setTheme(target);
                    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                }
                overlay.addEventListener('animationend', finish, { once: true });
                setTimeout(finish, 900);
                requestAnimationFrame(function () { overlay.classList.add('run'); });
            });
        })();
    </script>
