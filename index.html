<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>低配挂机研讨会 — 官方网站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans SC', 'sans-serif'],
                        display: ['Space Grotesk', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        'ink': '#000000',
                        'paper': '#ffffff',
                        'ash': '#888888',
                        'smoke': '#555555',
                        'charcoal': '#333333',
                        'graphite': '#1a1a1a',
                        'fog': '#0a0a0a',
                        'line': '#222222',
                    }
                }
            }
        }
    </script>
    <style>
        /* 所有样式完全保留原样，这里省略（与之前一致） */
        :root { --bg: #000000; --fg: #ffffff; --muted: #888888; --line: #222222; --hover-bg: #ffffff; --hover-fg: #000000; }
        * { margin:0; padding:0; box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#333 #000; }
        *::-webkit-scrollbar { width:4px; }
        *::-webkit-scrollbar-track { background:#000; }
        *::-webkit-scrollbar-thumb { background:#333; border-radius:0; }
        body { background:var(--bg); color:var(--fg); font-family:'Noto Sans SC',sans-serif; overflow-x:hidden; cursor:crosshair; }
        body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events:none; z-index:9998; opacity:0.4; }
        ::selection { background:#fff; color:#000; }
        .display { font-family:'Space Grotesk','Noto Sans SC',sans-serif; font-weight:700; letter-spacing:-0.03em; line-height:0.95; }
        .mono { font-family:'Space Grotesk',monospace; font-weight:400; letter-spacing:0.05em; }
        .rule { height:1px; background:var(--line); }
        .rule-v { width:1px; background:var(--line); }
        .video-row { position:relative; transition:all 0.4s cubic-bezier(0.16,1,0.3,1); border-bottom:1px solid var(--line); }
        .video-row::before { content:''; position:absolute; inset:0; background:var(--paper); transform:scaleY(0); transform-origin:bottom; transition:transform 0.4s cubic-bezier(0.16,1,0.3,1); z-index:0; }
        .video-row:hover::before { transform:scaleY(1); transform-origin:top; }
        .video-row:hover { border-color:var(--paper); }
        .video-row:hover .row-text { color:var(--hover-fg); }
        .video-row:hover .row-muted { color:var(--smoke); }
        .video-row:hover .row-index { color:var(--hover-fg); -webkit-text-stroke-color:var(--hover-fg); }
        .video-row:hover .row-img { filter:grayscale(0) contrast(1.1); }
        .row-text, .row-muted, .row-index, .row-img { position:relative; z-index:1; transition:all 0.4s cubic-bezier(0.16,1,0.3,1); }
        .row-img { filter:grayscale(1) contrast(0.9); }
        .row-index { font-family:'Space Grotesk',sans-serif; font-size:3rem; font-weight:700; color:transparent; -webkit-text-stroke:1px var(--line); line-height:1; transition:all 0.4s ease; }
        .marquee-track { display:flex; animation:marquee 30s linear infinite; white-space:nowrap; }
        @keyframes marquee { 0% { transform:translateX(0); } 100% { transform:translateX(-50%); } }
        .reveal-up { opacity:0; transform:translateY(60px); transition:all 1s cubic-bezier(0.16,1,0.3,1); }
        .reveal-up.visible { opacity:1; transform:translateY(0); }
        .char-reveal { display:inline-block; opacity:0; transform:translateY(100%); transition:all 0.6s cubic-bezier(0.16,1,0.3,1); }
        .char-reveal.visible { opacity:1; transform:translateY(0); }
        .grid-bg { background-image:linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size:80px 80px; }
        .cursor-dot { position:fixed; width:8px; height:8px; background:#fff; border-radius:50%; pointer-events:none; z-index:9999; mix-blend-mode:difference; transition:transform 0.15s ease; }
        .cursor-ring { position:fixed; width:40px; height:40px; border:1px solid rgba(255,255,255,0.3); border-radius:50%; pointer-events:none; z-index:9999; transition:all 0.3s ease; }
        .filter-tab { position:relative; padding:0.5rem 0; color:var(--muted); transition:color 0.3s; cursor:pointer; }
        .filter-tab::after { content:''; position:absolute; bottom:0; left:0; width:0; height:1px; background:var(--paper); transition:width 0.3s ease; }
        .filter-tab:hover, .filter-tab.active { color:var(--paper); }
        .filter-tab.active::after, .filter-tab:hover::after { width:100%; }
        .search-field { background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--paper); padding:0.75rem 0; width:100%; font-size:0.875rem; transition:border-color 0.3s; }
        .search-field:focus { outline:none; border-color:var(--paper); }
        .search-field::placeholder { color:var(--charcoal); }
        #loader { position:fixed; inset:0; background:#000; z-index:10000; display:flex; align-items:center; justify-content:center; transition:opacity 0.8s ease, visibility 0.8s; }
        #loader.done { opacity:0; visibility:hidden; pointer-events:none; }
        .loader-text { font-family:'Space Grotesk',sans-serif; font-size:0.75rem; letter-spacing:0.2em; color:var(--muted); }
        .loader-bar { width:120px; height:1px; background:var(--line); margin-top:1rem; position:relative; overflow:hidden; }
        .loader-bar::after { content:''; position:absolute; left:-100%; top:0; width:100%; height:100%; background:var(--paper); animation:loadSlide 1.5s ease-in-out infinite; }
        @keyframes loadSlide { 0% { left:-100%; } 50% { left:0; } 100% { left:100%; } }
        .stat-big { font-family:'Space Grotesk',sans-serif; font-size:clamp(3rem,8vw,6rem); font-weight:700; line-height:1; letter-spacing:-0.04em; }
        .latest-card { position:relative; background:var(--graphite); border:1px solid var(--line); overflow:hidden; transition:all 0.4s cubic-bezier(0.16,1,0.3,1); cursor:pointer; }
        .latest-card:hover { border-color:var(--paper); transform:translateY(-4px); background:var(--charcoal); }
        .latest-card .cover-wrap { position:relative; padding-bottom:56.25%; background:var(--fog); overflow:hidden; }
        .latest-card .cover-wrap img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease; filter:grayscale(0.3) contrast(0.95); }
        .latest-card:hover .cover-wrap img { transform:scale(1.04); filter:grayscale(0) contrast(1.05); }
        .latest-card .card-title { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.4; font-weight:500; }
        .latest-card .card-meta { font-size:0.7rem; letter-spacing:0.05em; }
        .skeleton-pulse { animation:skeletonPulse 1.5s ease-in-out infinite; }
        @keyframes skeletonPulse { 0%,100% { opacity:0.3; } 50% { opacity:0.6; } }
        @media (max-width:768px) { .row-index { font-size:2rem; } .latest-card .card-title { font-size:0.85rem; } }
        .spin { animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <!-- 所有 HTML 结构不变，省略（与之前完全一致） -->
    <!-- 为了节省篇幅，我给出关键的 script 部分，您只需替换 <script> 内容 -->
    <script>
        // ===== 配置 =====
        const WORKER_URL = 'https://bili-proxy.2210134507js.workers.dev/';

        // ===== 图片代理 =====
        function proxyImage(url) {
            if (!url || !url.startsWith('http')) return url;
            if (url.includes('images.weserv.nl') || url.includes('i3.wp.com')) return url;
            if (url.includes('hdslb.com')) {
                return `https://images.weserv.nl/?url=${encodeURIComponent(url)}&w=400&h=225&fit=cover`;
            }
            return url;
        }

        // ===== 精选视频 =====
        const videos = [
            { title: "【明日方舟】2025神级开局攻略 16分钟让你少走6年弯路", bvid: "BV1mw4m1r7qM", category: "guide", views: "12.5万", duration: "16:32", date: "2024-11-10", cover: "https://i0.hdslb.com/bfs/archive/978461ef1f89b05bef8e5f415b8ce492330b6799.jpg" },
            { title: "【明日方舟】2025神级主线攻略 单核轻松！摆完挂机！0-8章", bvid: "BV1E2p6zXEcP", category: "main", views: "7.8万", duration: "7:44:44", date: "2025-05-03", cover: "https://i2.hdslb.com/bfs/archive/1bba2fb35a247998670b29ea64006905a93406b5.jpg" }
        ];

        let currentCategory = 'all';
        let displayedCount = 10;

        // ===== 从 Worker 获取数据 =====
        async function fetchBilibiliLatest() {
            try {
                const resp = await fetch(WORKER_URL, { signal: AbortSignal.timeout(10000) });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const json = await resp.json();
                if (json.code === 0 && json.data) {
                    return json.data;
                } else {
                    throw new Error(json.message || '接口返回错误');
                }
            } catch (error) {
                console.error('请求 Worker 失败:', error.message);
                return null;
            }
        }

        // ===== ★ 修复：直接使用 item.link =====
        function renderLatest(items) {
            const grid = document.getElementById('latestGrid');
            const errorEl = document.getElementById('latestError');

            if (!items || items.length === 0) {
                grid.innerHTML = '';
                errorEl.classList.remove('hidden');
                return;
            }
            errorEl.classList.add('hidden');

            const slice = items.slice(0, 8);
            grid.innerHTML = slice.map((item) => {
                // ★★★ 直接使用完整链接 ★★★
                const videoUrl = item.link || '#';
                let cover = item.media?.thumbnail || item.thumbnail || item.cover || '';
                cover = proxyImage(cover);
                let pubDate = item.pubDate || item.published || item.date || '';
                let dateStr = '近期';
                if (pubDate) {
                    try {
                        const d = new Date(pubDate);
                        if (!isNaN(d)) {
                            dateStr = d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
                        }
                    } catch (_) {}
                }
                const title = item.title || '无标题';

                return `
                    <a href="${videoUrl}" target="_blank" class="latest-card group block">
                        <div class="cover-wrap">
                            <img src="${cover}" alt="${title}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://images.weserv.nl/?url=https://i0.hdslb.com/bfs/archive/default.jpg&w=400&h=225&fit=cover'" />
                            <div class="absolute bottom-2 right-2 bg-ink/80 text-paper text-[10px] px-2 py-0.5 mono tracking-wider opacity-0 group-hover:opacity-100 transition-opacity">
                                观看
                            </div>
                        </div>
                        <div class="p-3 md:p-4">
                            <div class="card-title text-sm md:text-base text-paper group-hover:text-paper line-clamp-2">${title}</div>
                            <div class="card-mono text-[10px] text-muted mt-2 flex items-center gap-3">
                                <span>${dateStr}</span>
                                <span class="w-px h-3 bg-line"></span>
                                <span>B站同步</span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // ===== 加载最新 =====
        async function loadLatest(showLoading = true) {
            const grid = document.getElementById('latestGrid');
            const errorEl = document.getElementById('latestError');
            const refreshIcon = document.getElementById('refreshIcon');

            if (showLoading) {
                grid.innerHTML = Array.from({ length: 8 }, (_, i) => `
                    <div class="latest-card skeleton-pulse" style="border-color:var(--line);">
                        <div class="cover-wrap bg-charcoal/50"></div>
                        <div class="p-3 md:p-4">
                            <div class="h-4 bg-charcoal/50 rounded w-3/4 mb-2"></div>
                            <div class="h-3 bg-charcoal/50 rounded w-1/2"></div>
                        </div>
                    </div>
                `).join('');
                errorEl.classList.add('hidden');
                refreshIcon.classList.add('spin');
            }

            try {
                const items = await fetchBilibiliLatest();
                if (items && items.length > 0) {
                    renderLatest(items);
                    localStorage.setItem('bili_latest_cache', JSON.stringify(items));
                } else {
                    const cached = localStorage.getItem('bili_latest_cache');
                    if (cached) {
                        try {
                            const parsed = JSON.parse(cached);
                            if (parsed && parsed.length > 0) {
                                renderLatest(parsed);
                                errorEl.classList.add('hidden');
                                return;
                            }
                        } catch (_) {}
                    }
                    grid.innerHTML = '';
                    errorEl.classList.remove('hidden');
                }
            } catch (_) {
                const cached = localStorage.getItem('bili_latest_cache');
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        if (parsed && parsed.length > 0) {
                            renderLatest(parsed);
                            errorEl.classList.add('hidden');
                            return;
                        }
                    } catch (_) {}
                }
                grid.innerHTML = '';
                errorEl.classList.remove('hidden');
            } finally {
                refreshIcon.classList.remove('spin');
            }
        }

        // ===== 精选视频列表渲染 =====
        function renderVideos(filter = '') {
            const list = document.getElementById('videoList');
            const filtered = videos.filter(v => {
                const matchCat = currentCategory === 'all' || v.category === currentCategory;
                const matchSearch = v.title.toLowerCase().includes(filter.toLowerCase());
                return matchCat && matchSearch;
            });

            const toShow = filtered.slice(0, displayedCount);
            if (toShow.length === 0) {
                list.innerHTML = `<div class="text-center py-16 text-muted text-sm">没有找到匹配的攻略</div>`;
                document.getElementById('loadMoreBtn').style.display = 'none';
                return;
            }

            list.innerHTML = toShow.map((v, i) => {
                const cover = proxyImage(v.cover);
                return `
                    <a href="https://www.bilibili.com/video/${v.bvid}" target="_blank" 
                       class="video-row block py-6 md:py-8 px-4 md:px-6 -mx-4 md:-mx-6">
                        <div class="flex items-center gap-4 md:gap-8">
                            <div class="w-12 md:w-20 flex-shrink-0">
                                <span class="row-index">${String(i + 1).padStart(2, '0')}</span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="row-text text-base md:text-lg font-medium leading-snug mb-2 truncate">${v.title}</h3>
                                <div class="row-muted flex items-center gap-4 md:gap-6 text-xs mono">
                                    <span>${v.date}</span>
                                    <span class="hidden sm:inline">${v.views} views</span>
                                    <span class="hidden sm:inline">${v.duration}</span>
                                    <span class="sm:hidden">${v.views}</span>
                                </div>
                            </div>
                            <div class="hidden md:block w-32 h-20 flex-shrink-0 overflow-hidden">
                                <img src="${cover}" alt="" class="row-img w-full h-full object-cover" loading="lazy" referrerpolicy="no-referrer"
                                     onerror="this.style.display='none'">
                            </div>
                            <div class="hidden md:flex items-center justify-center w-10 h-10 border border-line group-hover:border-ink flex-shrink-0 transition-colors">
                                <svg class="w-4 h-4 row-text" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                                </svg>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');

            document.getElementById('loadMoreBtn').style.display =
                displayedCount < filtered.length ? 'inline-block' : 'none';
        }

        function loadMore() {
            displayedCount += 10;
            renderVideos(document.getElementById('searchInput').value);
        }

        // ===== 其他辅助函数（计数器、滚动、光标等） =====
        // ... 省略（与之前相同）
        function animateCounters() { /* ... */ }
        // 由于篇幅，我不再重复所有其他函数，但您可以照抄之前版本中的其他部分

        // ===== 初始化 =====
        renderVideos();
        loadLatest(true);

        window.loadMore = loadMore;
    </script>
</body>
</html>
