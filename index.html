<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>低配挂机研讨会</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
    <!-- 导航 -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-black/90 border-b border-gray-800 px-6 h-16 flex items-center justify-between">
        <a href="#" class="text-sm font-bold">低配挂机研讨会</a>
        <a href="https://space.bilibili.com/3546373951588920" target="_blank" class="text-xs text-gray-400 border border-gray-700 px-4 py-2 hover:text-white">BILIBILI</a>
    </nav>

    <!-- Hero -->
    <section class="pt-32 pb-20 px-6 text-center">
        <h1 class="text-6xl md:text-8xl font-bold leading-tight">低配挂机<br /><span class="text-gray-500">研讨会</span></h1>
        <p class="text-gray-400 mt-6 max-w-md mx-auto">愿为世界添砖加瓦，让每一位博士都能轻松通关。</p>
    </section>

    <!-- 最新投稿 -->
    <section class="px-6 py-16 max-w-6xl mx-auto">
        <h2 class="text-3xl font-bold mb-8">最新投稿</h2>
        <div id="latestGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- 由 JS 动态渲染 -->
        </div>
        <div id="errorMsg" class="hidden text-center text-gray-400 py-8">暂时无法获取最新投稿</div>
    </section>

    <!-- 精选攻略 -->
    <section class="px-6 py-16 max-w-6xl mx-auto border-t border-gray-800">
        <h2 class="text-3xl font-bold mb-8">精选攻略</h2>
        <div id="videoList"></div>
    </section>

    <footer class="text-center text-xs text-gray-500 py-8 border-t border-gray-800">
        © 2024-2026 低配挂机研讨会
    </footer>

    <script>
        // ===== Worker 地址 =====
        const WORKER_URL = 'https://bili-proxy.2210134507js.workers.dev/';

        // ===== 图片代理 =====
        function proxyImage(url) {
            if (!url || !url.startsWith('http')) return 'https://i0.hdslb.com/bfs/archive/default.jpg';
            if (url.includes('hdslb.com')) {
                return `https://images.weserv.nl/?url=${encodeURIComponent(url)}&w=400&h=225&fit=cover`;
            }
            return url;
        }

        // ===== 精选视频（手动维护） =====
        const videos = [
            { title: "【明日方舟】2025神级开局攻略", bvid: "BV1mw4m1r7qM", cover: "https://i0.hdslb.com/bfs/archive/978461ef1f89b05bef8e5f415b8ce492330b6799.jpg" },
            { title: "【明日方舟】2025神级主线攻略", bvid: "BV1E2p6zXEcP", cover: "https://i2.hdslb.com/bfs/archive/1bba2fb35a247998670b29ea64006905a93406b5.jpg" },
            // 您可以继续添加更多视频
        ];

        // ===== 获取最新数据 =====
        async function fetchLatest() {
            try {
                const resp = await fetch(WORKER_URL, { signal: AbortSignal.timeout(8000) });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const json = await resp.json();
                if (json.code === 0 && json.data) return json.data;
                throw new Error('数据格式错误');
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        // ===== 渲染最新投稿 =====
        async function renderLatest() {
            const grid = document.getElementById('latestGrid');
            const errorEl = document.getElementById('errorMsg');
            const items = await fetchLatest();

            if (!items || items.length === 0) {
                grid.innerHTML = '';
                errorEl.classList.remove('hidden');
                return;
            }
            errorEl.classList.add('hidden');

            grid.innerHTML = items.slice(0, 8).map(item => {
                const bvid = (item.link || '').match(/BV[a-zA-Z0-9]+/)?.[0] || '';
                const cover = proxyImage(item.media?.thumbnail || '');
                return `
                    <a href="https://www.bilibili.com/video/${bvid}" target="_blank" class="bg-gray-900 border border-gray-700 hover:border-white transition">
                        <div class="aspect-video overflow-hidden">
                            <img src="${cover}" alt="${item.title}" class="w-full h-full object-cover" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://i0.hdslb.com/bfs/archive/default.jpg'" />
                        </div>
                        <div class="p-3">
                            <div class="text-sm line-clamp-2">${item.title}</div>
                            <div class="text-xs text-gray-400 mt-1">${new Date(item.pubDate).toLocaleDateString()}</div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // ===== 渲染精选视频 =====
        function renderVideos() {
            const list = document.getElementById('videoList');
            list.innerHTML = videos.map(v => `
                <a href="https://www.bilibili.com/video/${v.bvid}" target="_blank" class="block border-b border-gray-800 py-4 hover:bg-white/5 px-4">
                    <div class="flex items-center gap-4">
                        <img src="${proxyImage(v.cover)}" alt="" class="w-20 h-12 object-cover" referrerpolicy="no-referrer" onerror="this.style.display='none'" />
                        <span class="text-sm">${v.title}</span>
                    </div>
                </a>
            `).join('');
        }

        // ===== 初始化 =====
        renderLatest();
        renderVideos();

        // 可选：手动刷新按钮（按需添加）
        // 但极简版不添加，避免复杂
    </script>
</body>
</html>
