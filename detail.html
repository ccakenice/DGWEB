    <style id="theme-css">
        /* ===== V0.17 白昼模式 ===== */
        html.light { --bg:#f4f4f2; --fg:#141414; --muted:#787878; --line:#e2e2df; --hover-bg:#141414; --hover-fg:#f4f4f2; --paper:#141414; --charcoal:#c6c6c3; --smoke:#6a6a68; --graphite:#ececea; --fog:#efefed; --ash:#8a8a88; --acc:#e08f00; --acc-dim:rgba(224,143,0,.10); }
        html.light body { background:var(--bg); color:var(--fg); }
        html.light body::before { filter:invert(1); opacity:.5; }
        html.light *::-webkit-scrollbar-track { background:#ececea; }
        html.light *::-webkit-scrollbar-thumb { background:#c4c4c1; }
        html.light * { scrollbar-color:#c4c4c1 #ececea; }
        html.light #loader { background:#f4f4f2; }
        html.light .grid-bg { background-image:linear-gradient(rgba(0,0,0,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.045) 1px, transparent 1px); }
        html.light .hero-mark { -webkit-text-stroke-color:rgba(0,0,0,.09); }
        html.light .cursor-ring { border-color:rgba(0,0,0,.28); }
        html.light .stat-cell { background:linear-gradient(180deg, rgba(0,0,0,.028), transparent); }
        html.light .latest-card:hover { box-shadow:0 12px 36px rgba(0,0,0,.16), 0 0 0 1px rgba(224,143,0,.28); }
        html.light .bg-ink, html.light .bg-ink\/80, html.light .bg-ink\/90, html.light .bg-ink\/95 { background-color:#f4f4f2; }
        html.light .text-paper { color:#141414; }
        html.light .border-paper, html.light .border-paper\/60 { border-color:#141414; }
        html.light .text-ink { color:#f4f4f2; }
        html.light .text-ash\/60 { color:rgba(20,20,20,.58); }
        html.light .text-ash\/50 { color:rgba(20,20,20,.5); }
        html.light .text-smoke { color:#6a6a68; }
        html.light .border-line, html.light .border-line\/50 { border-color:#e2e2df; }
        html.light .stroke-line { stroke:#e2e2df; }
        html.light .divide-line > :not([hidden]) ~ :not([hidden]) { border-color:#e2e2df; }
        html.light .bg-line, html.light .bg-line\/30, html.light .bg-line\/50 { background-color:#e2e2df; }
        html.light .bg-graphite { background-color:#ececea; }
        html.light .bg-charcoal, html.light .bg-charcoal\/50 { background-color:#d8d8d5; }
        html.light .bg-fog { background-color:#efefed; }
        html.light .bg-paper { background-color:#141414; }
        html.light .bg-black, html.light .bg-black\/70, html.light .bg-black\/80 { background-color:rgba(244,244,242,.92); }
        .theme-overlay { position:fixed; border-radius:50%; transform:scale(0); pointer-events:none; z-index:9999; }
        .theme-overlay.run { animation:themeWipe .55s cubic-bezier(.4,0,.2,1) forwards; }
        @keyframes themeWipe { to { transform:scale(1); } }
        #themeToggle { position:fixed; right:20px; bottom:96px; width:44px; height:44px; z-index:60; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--line); background:var(--fg); color:var(--bg); cursor:pointer; transition:transform .3s ease, background .3s ease, color .3s ease; box-shadow:0 4px 14px rgba(0,0,0,.18); }
        #themeToggle:hover { transform:rotate(180deg) scale(1.06); }
        @media (max-width:768px) { #themeToggle { right:14px; bottom:80px; width:40px; height:40px; } }
    </style>

    <script>
        const DATA_URLS = [
            '/latest.json',
            'https://cdn.jsdelivr.net/gh/ccakenice/bili-sync@main/latest.json',
            'https://raw.githubusercontent.com/ccakenice/bili-sync/main/latest.json'
        ];

        function fmtCount(n) {
            n = Number(n) || 0;
            if (n >= 100000000) return (n / 100000000).toFixed(1) + '亿';
            if (n >= 10000) return (n / 10000).toFixed(1) + '万';
            return String(n);
        }

        function fmtDuration(sec) {
            sec = Number(sec) || 0;
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return m + ':' + String(s).padStart(2, '0');
        }

        function fmtDate(s) {
            if (!s) return '近期';
            const d = new Date(s);
            if (isNaN(d)) return '近期';
            return d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        async function fetchData() {
            for (const url of DATA_URLS) {
                try {
                    const resp = await fetch(url, { signal: AbortSignal.timeout(10000) });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const json = await resp.json();
                    if (json.code === 0 && json.data) return json.data;
                } catch (e) {
                    console.error(`数据源失败 ${url}:`, e.message);
                }
            }
            const cached = localStorage.getItem('bili_latest_cache');
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (Array.isArray(parsed) && parsed.length) return parsed;
                } catch (_) {}
            }
            return null;
        }

        function statBox(label, value, delay) {
            return `
                <div class="reveal-up border border-line bg-graphite px-4 py-3" style="transition-delay:${delay}s">
                    <div class="display text-2xl mb-1">${value}</div>
                    <div class="mono text-[10px] text-muted tracking-widest">${label}</div>
                </div>`;
        }

        function renderVideo(item) {
            const wrap = document.getElementById('detailWrap');
            const title = item.title || '无标题';
            const desc = item.description || '暂无简介';
            const st = item.stat || {};
            const bvid = item.bvid || (item.link ? item.link.split('/').pop() : '');
            const tags = Array.isArray(item.tags) ? item.tags : [];
            const duration = item.duration ? String(item.duration) : '';

            const statsRows = `
                ${statBox('播放', fmtCount(st.play), 0.2)}
                ${statBox('点赞', fmtCount(st.like), 0.25)}
                ${statBox('弹幕', fmtCount(st.danmaku), 0.3)}
                ${statBox('评论', fmtCount(st.review), 0.35)}
                ${statBox('收藏', fmtCount(st.favorite), 0.4)}
                ${duration ? statBox('时长', duration, 0.45) : ''}`;

            const pages = Array.isArray(item.pages) ? item.pages : [];
            const MAX_PAGES_SHOWN = 20;
            const needsScroll = pages.length > MAX_PAGES_SHOWN;
            const pagesHtml = pages.length > 1 ? `
                <div class="reveal-up">
                    <span class="mono text-[10px] text-muted tracking-widest uppercase block mb-4">分P列表 (${pages.length})</span>
                    <div class="border border-line divide-y divide-line ${needsScroll ? 'overflow-y-auto max-h-[400px]' : ''}">
                        ${pages.map((p, i) => `
                            <button data-page="${p.page}" class="page-btn w-full flex items-center justify-between gap-3 px-4 py-3 text-left transition-colors ${i === 0 ? 'bg-charcoal text-paper' : 'text-muted hover:text-paper hover:bg-graphite'}">
                                <span class="flex items-center gap-3">
                                    <span class="mono text-[10px] w-6 text-center ${i === 0 ? 'text-paper' : 'text-smoke'}">P${p.page}</span>
                                    <span class="text-xs line-clamp-1">${p.part || ('P' + p.page)}</span>
                                </span>
                                ${p.duration ? `<span class="mono text-[10px] text-smoke shrink-0">${fmtDuration(p.duration)}</span>` : ''}
                            </button>`).join('')}
                    </div>
                </div>` : '';

            wrap.innerHTML = `
                <a href="index.html" class="mono text-xs text-muted hover:text-paper transition-colors tracking-widest uppercase flex items-center gap-2 mb-8">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18"/></svg>
                    返回全部投稿
                </a>

                <div class="grid lg:grid-cols-[1fr_340px] gap-10 md:gap-14">
                <div class="reveal-up">
                    <div class="relative bg-fog border border-line overflow-hidden mb-8" style="padding-bottom:56.25%">
                        <iframe
                            id="biliPlayer"
                            src="https://player.bilibili.com/player.html?bvid=${bvid}&page=1&high_quality=1"
                            class="absolute inset-0 w-full h-full"
                            scrolling="no" border="0" frameborder="no" framespacing="0"
                            allowfullscreen="true" allow="autoplay; fullscreen; picture-in-picture"
                            referrerpolicy="no-referrer"></iframe>
                        <div class="absolute top-4 left-4 mono text-[10px] text-muted border border-line bg-black/70 px-3 py-1 tracking-widest">${item.typename || 'BILIBILI'}</div>
                        ${duration ? `<div class="absolute bottom-4 right-4 mono text-[10px] bg-black/80 text-paper px-2 py-1">${duration}</div>` : ''}
                    </div>
                        <h1 class="display text-2xl md:text-4xl leading-tight mb-6">${title}</h1>
                        <div class="rule mb-6"></div>
                        <div class="flex flex-wrap items-center gap-4 mb-8 text-xs text-muted mono tracking-widest">
                            <span>${fmtDate(item.pubDate)}</span>
                            <span class="w-px h-3 bg-line"></span>
                            <span>B站同步</span>
                            <span class="w-px h-3 bg-line"></span>
                            <span>${bvid}</span>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-8">
                            ${statsRows}
                        </div>
                        <div class="text-sm text-muted leading-relaxed whitespace-pre-line">${desc}</div>
                        ${tags.length ? `
                            <div class="flex flex-wrap gap-3 mt-8">
                                ${tags.map(t => `<span class="mono text-xs border border-line px-3 py-1.5 text-muted"># ${t}</span>`).join('')}
                            </div>` : ''}
                    </div>

                    <aside class="space-y-10">
                        ${pagesHtml}
                        <div class="reveal-up" style="transition-delay:0.5s">
                            <span class="mono text-[10px] text-muted tracking-widest uppercase block mb-4">Watch</span>
                            <a href="${item.link || '#'}" target="_blank" class="block text-center mono text-sm font-bold tracking-widest uppercase bg-paper text-ink px-6 py-4 hover:bg-charcoal hover:text-paper transition-colors">
                                前往B站观看 ↗
                            </a>
                        </div>
                    </aside>
                </div>`;

            requestAnimationFrame(() => {
                document.querySelectorAll('.reveal-up').forEach((el, i) => {
                    setTimeout(() => el.classList.add('visible'), 50 + i * 60);
                });
            });

            const player = document.getElementById('biliPlayer');
            document.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = btn.dataset.page;
                    if (player) player.src = `https://player.bilibili.com/player.html?bvid=${bvid}&page=${page}&high_quality=1`;
                    document.querySelectorAll('.page-btn').forEach(b => {
                        b.classList.remove('bg-charcoal', 'text-paper');
                        b.classList.add('text-muted', 'hover:text-paper', 'hover:bg-graphite');
                        b.querySelector('span.mono') && b.querySelector('span.mono').classList.add('text-smoke');
                    });
                    btn.classList.add('bg-charcoal', 'text-paper');
                    btn.classList.remove('text-muted', 'hover:text-paper', 'hover:bg-graphite');
                    btn.querySelector('span.mono') && btn.querySelector('span.mono').classList.remove('text-smoke');
                });
            });
        }

        function renderError() {
            const wrap = document.getElementById('detailWrap');
            wrap.innerHTML = `
                <div class="text-center py-24 border border-line/50 grid-bg">
                    <p class="text-sm text-muted mb-6">未找到该视频，或数据暂时无法加载</p>
                    <a href="index.html" class="mono text-xs text-muted hover:text-paper transition-colors border border-line hover:border-paper px-6 py-3 inline-block">返回主页</a>
                </div>`;
        }

        (async function init() {
            const params = new URLSearchParams(location.search);
            const bvid = params.get('bvid');
            const wantPage = params.get('page');
            const items = await fetchData();
            if (!items) { renderError(); return; }
            const found = bvid
                ? items.find(it => it.bvid === bvid || (it.link && it.link.includes(bvid)))
                : items[0];
            if (found) {
                renderVideo(found);
                document.title = found.title + ' — 低配挂机研讨会';
                if (wantPage) {
                    const btn = document.querySelector(`.page-btn[data-page="${wantPage}"]`);
                    if (btn) btn.click();
                }
            } else {
                renderError();
            }
        })();
    </script>

    <style>
        .nav-toggle { display:flex; flex-direction:column; gap:5px; padding:8px 4px; background:none; border:none; cursor:pointer; }
        @media (min-width:768px) { .nav-toggle { display:none !important; } }
        .nav-toggle span { display:block; width:20px; height:2px; background:var(--muted); transition:transform .3s, opacity .3s; }
        .nav-toggle:hover span { background:var(--paper); }
        .nav-toggle.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
        .nav-toggle.open span:nth-child(2) { opacity:0; }
        .nav-toggle.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
        #mobileMenu { z-index:40; }
        #mobileMenu a { display:flex; align-items:center; justify-content:space-between; padding:14px 0; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid rgba(255,255,255,.06); transition:color .3s; }
        #mobileMenu a:hover, #mobileMenu a:active { color:var(--paper); }
        #mobileMenu a.acc { color:var(--acc); }
    </style>
    <script>
    (function () {
        var btn = document.getElementById('navToggle');
        var menu = document.getElementById('mobileMenu');
        if (!btn || !menu) return;
        btn.addEventListener('click', function () {
            var open = menu.classList.toggle('hidden') === false;
            btn.classList.toggle('open', open);
            btn.setAttribute('aria-expanded', String(open));
        });
        menu.querySelectorAll('a').forEach(function (a) {
            a.addEventListener('click', function () {
                menu.classList.add('hidden');
                btn.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
            });
        });
    })();
    </script>
</body>

    <button id="themeToggle" aria-label="切换到白昼" aria-pressed="false" title="白昼模式"></button>
    <script>
        (function () {
            var KEY = 'dgweb_theme';
            var SUN = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></svg>';
            var MOON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/></svg>';
            var root = document.documentElement;
            var btn = document.getElementById('themeToggle');

            function paint() {
                var light = root.classList.contains('light');
                btn.innerHTML = light ? MOON : SUN;
                btn.setAttribute('aria-label', light ? '切换到暗夜' : '切换到白昼');
                btn.setAttribute('aria-pressed', light ? 'true' : 'false');
                btn.setAttribute('title', light ? '黑夜模式' : '白昼模式');
            }

            function setTheme(t) {
                if (t === 'light') root.classList.add('light'); else root.classList.remove('light');
                try { localStorage.setItem(KEY, t); } catch (e) {}
                paint();
            }

            paint();

            btn.addEventListener('click', function (e) {
                var light = root.classList.contains('light');
                var target = light ? 'dark' : 'light';
                var switches = (window.__sw || (window.__sw = []));
                var now = Date.now();
                switches.push(now);
                while (switches.length > 0 && now - switches[0] > 60000) switches.shift();
                if (switches.length >= 4) { window.location.href = 'easter-egg.html'; return; }
                var cx = e.clientX, cy = e.clientY;
                var size = Math.max(window.innerWidth, window.innerHeight) * 2.4;
                var overlay = document.createElement('div');
                overlay.className = 'theme-overlay';
                overlay.style.width = overlay.style.height = size + 'px';
                overlay.style.left = (cx - size / 2) + 'px';
                overlay.style.top = (cy - size / 2) + 'px';
                overlay.style.background = (target === 'light') ? '#f4f4f2' : '#000000';
                document.body.appendChild(overlay);
                var done = false;
                function finish() {
                    if (done) return;
                    done = true;
                    setTheme(target);
                    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                }
                overlay.addEventListener('animationend', finish, { once: true });
                setTimeout(finish, 900);
                requestAnimationFrame(function () { overlay.classList.add('run'); });
            });
        })();
    </script>
</html>
